<!DOCTYPE html>
<html lang="en" data-theme="dynasty-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams — CFB Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="teams">
<script src="js/config.js"></script>
<script src="js/shell.js"></script>
<!-- ==================== MAIN CONTENT ==================== -->
<div class="main-content">
<div class="teams-layout">
  <!-- Sidebar: team list -->
  <aside class="teams-sidebar">
    <div class="sidebar-search">
      <input type="text" id="team-search" placeholder="Search teams…">
      <select id="year-select" title="Season year"></select>
    </div>
    <div id="conf-filter" class="conf-filter"></div>
    <div class="team-list" id="team-list">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>
  </aside>

  <!-- Main: team detail -->
  <main class="teams-main" id="teams-main">
    <div class="team-placeholder">
      <p class="empty-state">Select a team from the list.</p>
    </div>
  </main>
</div>

<div id="player-modal" class="modal">
  <div class="modal-inner"></div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="js/dataLoader.js"></script>
<script src="js/ui.js"></script>
<script src="js/playerSearch.js"></script>
<script src="js/teamsPage.js"></script>
<script>
  initTeamsPage();
</script>
</div><!-- /.main-content -->
</body>
</html>
