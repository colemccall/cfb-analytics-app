     A shell. Everything is rendered by changesPage.js from the CHANGES registry
     in changes.js. methods.js is loaded because an entry's `methods` ids are
     validated against the METHODS registry at render time — an id with no entry
     renders as plain text rather than a link to nowhere.
     Adding a build-log entry means adding a registry entry, never page code. -->
<div class="main-content">
  <div id="changes-root"></div>
</div>

<script src="js/ui.js"></script>
