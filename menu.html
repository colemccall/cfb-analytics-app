<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFB Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,900&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/menu.css">
  <!-- The saved light/dark mode, applied before the first paint so a light-mode visitor does not see a dark flash
       while the scripts load (menuChrome.js applies and stores it from then on). -->
  <script>try { if (localStorage.getItem("cfb-menu-mode") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) { /* default: dark */ }</script>
</head>
<body class="menu-body">
<script src="js/config.js"></script>
<!-- ==================== THE MENU ====================
     The app: its own frame, screens and navigation, driven by mouse, keyboard or a
     game controller. shell.js is NOT loaded (no sidebar). Two modes, dark and light,
     one token block each in css/menu.css. Everything is drawn by menuChrome.js and the
     menuScreens*.js files into #menu-root; this file is only the shell. -->
<div id="menu-root" class="menu-app"></div>
<script>try { if (localStorage.getItem("cfb-menu-mode") === "light") document.getElementById("menu-root").dataset.mode = "light"; } catch (e) { /* default: dark */ }</script>

<script src="js/dataLoader.js"></script>
<script src="js/ui.js"></script>
<script src="js/leagueData.js"></script>
<script src="js/dataTable.js"></script>
<script src="js/methods.js"></script>
<script src="js/methodsPage.js"></script>
<script src="js/changes.js"></script>
<script src="js/changesPage.js"></script>
<script src="js/guide.js"></script>
<script src="js/guidePage.js"></script>
<script src="js/findings.js"></script>
<script src="js/findingPage.js"></script>
<script src="js/menuInput.js"></script>
<script src="js/menuFocus.js"></script>
<script src="js/menuChrome.js"></script>
<script src="js/menuBackdrop.js"></script>
<script src="js/menuRouter.js"></script>
<script src="js/menuScreens.js"></script>
<script src="js/menuCard.js"></script>
<script src="js/menuWeekly.js"></script>
<script src="js/menuScreensTeam.js"></script>
<script src="js/menuScreensLeague.js"></script>
<script src="js/menuScreensClass.js"></script>
<script src="js/menuScreensPages.js"></script>
<script src="js/menuGame.js"></script>
<script src="js/menuHome.js"></script>
<script>
  const root = document.getElementById("menu-root");
  menuInput.start();
  menuFocus.attach(root);
  menuChrome.build(root);
  menuBackdrop.build(root);
  menuRouter.start();
</script>
</body>
</html>
