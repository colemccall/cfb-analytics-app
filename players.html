<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players — CFB Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="players">
<script src="js/config.js"></script>
<script src="js/shell.js"></script>
<!-- ==================== MAIN CONTENT ==================== -->
<div class="main-content">

<div class="page-hero animate-pop">
  <h1>Player Search</h1>
  <p class="page-hero-sub">Draft board — ranked by overall rating. Click any row for the full SHAP breakdown.</p>
</div>

<div class="page-content">
  <!-- Top filter bar: search + selects + rating slider -->
  <div class="filter-bar">
    <div class="filter-group">
      <input type="text" id="search-input" placeholder="Search player or team…">
    </div>
    <div class="filter-group">
      <select id="filter-conference">
        <option value="">All Conferences</option>
      </select>
    </div>
    <div class="filter-group">
      <select id="filter-season"></select>  <!-- options filled by fillSeasonSelect() -->
    </div>
    <div class="filter-group filter-group-range">
      <span class="filter-label">Min OVR: <strong id="min-rating-label">0</strong></span>
      <input type="range" id="filter-min-rating" min="0" max="99" value="0" step="1">
    </div>
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- Position chip filters (two rows: offense / defense+special) -->
  <div class="pos-filter-rows">
    <div class="pos-filter-row" id="pos-chips-offense"></div>
    <div class="pos-filter-row" id="pos-chips-defense"></div>
  </div>

  <div class="player-grid" id="player-grid">
    <p class="empty-state">Loading players…</p>
  </div>
</div>

<!-- Player detail modal -->
<div class="modal" id="player-modal">
  <div class="modal-inner"></div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="js/dataLoader.js"></script>
<script src="js/ui.js"></script>
<script src="js/playerSearch.js"></script>
<script>
  initPlayerSearch();
</script>
</div><!-- /.main-content -->
</body>
</html>
